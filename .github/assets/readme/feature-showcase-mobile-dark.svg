<rect x="1074" y="588" width="290" height="49" rx="9" fill="#133c32"/>
<text x="1090" y="621" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#52e0ae">Flowee the Hub</text>
<text x="764" y="678" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#f0f6fc">Multi-node failover. RPC + notifications or polling.</text>
<text x="764" y="716" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#aab9c3">BCHD and Flowee use the documented polling setup.</text>
<rect x="48" y="774" width="656" height="272" rx="16" fill="#151e25" stroke="#33434e"/>
<text x="76" y="814" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="650" fill="#52e0ae">REGIONAL LATENCY</text>
<text x="76" y="859" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="31" font-weight="650" fill="#f0f6fc">Choose a location from your browser.</text>
<text x="76" y="898" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="600" fill="#f0f6fc">Visitor</text>
