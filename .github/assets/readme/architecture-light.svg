<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="740" viewBox="0 0 1440 740" role="img" aria-labelledby="title desc">
<title id="title">CashStratum mining and observability architecture</title><desc id="desc">ASICs, NiceHash and MiningRigRentals connect via Stratum V1 to the C engine. The engine connects to BCHN, BCHD or Flowee over RPC. BCHN supports ZMQ notifications; the documented BCHD and Flowee setup uses polling. Status and logs feed shell monitoring and the read-only Go API.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#087e57" stroke-width="1.5"/></marker></defs>
