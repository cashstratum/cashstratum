<text x="500" y="965" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="22" font-weight="400" fill="#09669b">/ping</text>
<text x="76" y="1014" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#51655f">Compare browser → regional host HTTP round trips.</text>
<rect x="736" y="774" width="656" height="272" rx="16" fill="#ffffff" stroke="#c9d8d2"/>
<text x="764" y="814" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="650" fill="#087e57">OPERATOR VISIBILITY</text>
<text x="764" y="859" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="31" font-weight="650" fill="#152c24">Show the work. Show the result.</text>
<text x="764" y="900" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="23" font-weight="400" fill="#09669b">/stats   /coinbase   /shares</text>
