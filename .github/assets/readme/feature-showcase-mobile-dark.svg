<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="720" height="1964" viewBox="0 0 720 1964" role="img" aria-labelledby="mobile-title mobile-desc"><title id="mobile-title">The CashStratum advantage</title><desc id="mobile-desc">Six mining features in a readable single-column layout.</desc><defs><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#52e0ae" stroke-width="1.5"/></marker></defs><g id="overview"><text x="48" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#52e0ae">BUILT INTO CASHSTRATUM</text>
<text x="48" y="101" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="38" font-weight="650" fill="#f0f6fc">Everything between a miner and a block.</text>
<text x="48" y="139" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#aab9c3">BCH-native payouts. Rental-aware connections. A pool you can inspect.</text>
<rect x="48" y="182" width="656" height="272" rx="16" fill="#151e25" stroke="#33434e"/>
<text x="76" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="650" fill="#52e0ae">DIRECT PAYOUTS</text>
<text x="76" y="267" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="31" font-weight="650" fill="#f0f6fc">Your address. Your block reward.</text>
<rect x="76" y="292" width="205" height="45" rx="9" fill="#133c32"/>
<text x="92" y="323" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#52e0ae">Native CashAddr</text>
<path d="M297 315 H357" fill="none" stroke="#52e0ae" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="381" y="316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="600" fill="#f0f6fc">Miner reward</text>
<text x="381" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#aab9c3">+ operator fee</text>
<text x="76" y="408" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#aab9c3">Outputs written into the block coinbase.</text>
<rect x="736" y="182" width="656" height="272" rx="16" fill="#151e25" stroke="#33434e"/>
<text x="764" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="650" fill="#52e0ae">RENTAL-AWARE</text>
<text x="764" y="267" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="31" font-weight="650" fill="#f0f6fc">Detected. Configured. Ready.</text>
<rect x="764" y="292" width="218" height="42" rx="8" fill="#133c32"/>
<text x="781" y="321" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#52e0ae">NiceHash</text>
<rect x="997" y="292" width="367" height="42" rx="8" fill="#133c32"/>
<text x="1013" y="321" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#52e0ae">MiningRigRentals / MRR-Hash</text>
<path d="M1064 346 V368" fill="none" stroke="#52e0ae" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="764" y="403" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="550" fill="#f0f6fc">Recognize client → apply bounded difficulty</text>
<text x="764" y="435" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#aab9c3">Send mining.set_difficulty after authorization.</text>
<rect x="48" y="478" width="656" height="272" rx="16" fill="#151e25" stroke="#33434e"/>
<text x="76" y="518" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="650" fill="#52e0ae">INDEPENDENT ROUNDS</text>
<text x="76" y="563" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="31" font-weight="650" fill="#f0f6fc">One miner wins. Others keep going.</text>
<text x="76" y="604" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#f0f6fc">Miner A</text>
<rect x="230" y="585" width="343" height="18" rx="9" fill="#33434e"/>
<circle cx="239" cy="594" r="8" fill="#52e0ae"/>
<text x="589" y="604" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#52e0ae">Reset</text>
<text x="76" y="652" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#f0f6fc">Miner B</text>
<rect x="230" y="633" width="343" height="18" rx="9" fill="#33434e"/>
<rect x="230" y="633" width="248" height="18" rx="9" fill="#52e0ae"/>
