<text x="76" y="706" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#aab9c3">Round shares and luck tracked per payout identity.</text>
<rect x="736" y="478" width="656" height="272" rx="16" fill="#151e25" stroke="#33434e"/>
<text x="764" y="518" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="650" fill="#52e0ae">NODE CHOICE + RESILIENCE</text>
<text x="764" y="563" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="31" font-weight="650" fill="#f0f6fc">Choose the node behind your pool.</text>
<rect x="764" y="588" width="139" height="49" rx="9" fill="#133c32"/>
<text x="780" y="621" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#52e0ae">BCHN</text>
<rect x="919" y="588" width="139" height="49" rx="9" fill="#133c32"/>
