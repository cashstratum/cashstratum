<text x="317" y="965" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="550" fill="#f0f6fc">Asia</text>
<text x="500" y="965" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="22" font-weight="400" fill="#82caff">/ping</text>
<text x="76" y="1014" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#aab9c3">Compare browser → regional host HTTP round trips.</text>
<rect x="736" y="774" width="656" height="272" rx="16" fill="#151e25" stroke="#33434e"/>
<text x="764" y="814" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="650" fill="#52e0ae">OPERATOR VISIBILITY</text>
<text x="764" y="859" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="31" font-weight="650" fill="#f0f6fc">Show the work. Show the result.</text>
<text x="764" y="900" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="23" font-weight="400" fill="#82caff">/stats   /coinbase   /shares</text>
<rect x="764" y="921" width="600" height="46" rx="9" fill="#133c32"/>
<text x="785" y="952" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="25" font-weight="650" fill="#52e0ae">&gt; BLOCK ACCEPTED!</text>
<text x="764" y="1014" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#aab9c3">Read-only Go API + color-coded terminal monitoring.</text>
<text x="48" y="1070" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#aab9c3">Regional endpoint setup is operator-managed; /ping measures HTTP latency, not Stratum job delivery.</text></g></defs>
