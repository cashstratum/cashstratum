<text x="317" y="924" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="550" fill="#f0f6fc">Europe</text>
<text x="500" y="924" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="22" font-weight="400" fill="#82caff">/ping</text>
