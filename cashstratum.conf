CashStratum default configuration.
- btcsig: Signature string included in coinbase transactions.
- sockdir: Not read from this file; set the socket directory with -s on the command line.
  Run a second instance with its own -n, -s, logdir and ports.
- poolfee_strict: Default true. With poolfee above 0, an invalid or missing pooladdress stops startup
  instead of silently disabling the fee. Set false to keep the old warn-and-disable behaviour.
- bchaddress: Solo mining payout address (CashAddr format).
- pooladdress: Fee collection address.
- poolfee: Percentage fee deducted from block reward.
- serverurl: Stratum mining endpoints listened on by CashStratum.
- useragent_diff: Optional object mapping a miner useragent substring to a rental difficulty floor, for
  example "useragent_diff" : { "nicehash" : 500000, "miningrigrentals" : 1000000, "mrr-hash" : 1000000,
  "braiins/hashpower" : 1000000 }. Matching is case-insensitive and by substring; the first entry in file
  order that matches wins, and its value is clamped to [mindiff, maxdiff]. A match starts the client at the
  floor: vardiff may raise it or lower it back toward the floor but never below it, and a lower d= password
  value is raised back to the floor. Entries with a non-positive value are ignored.
  When the key is absent the built-in table above is used (the mindiff_overrides keys nicehash,
  miningrigrentals and braiins still adjust the built-in values). When the key is present it REPLACES the
  built-in table entirely: list every service you want a floor for, and an empty object disables them all.
