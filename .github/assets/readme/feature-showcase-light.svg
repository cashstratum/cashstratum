<text x="785" y="952" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="25" font-weight="650" fill="#087e57">&gt; BLOCK ACCEPTED!</text>
<text x="764" y="1014" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#51655f">Read-only Go API + color-coded terminal monitoring.</text>
<text x="48" y="1070" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#51655f">Regional endpoint setup is operator-managed; /ping measures HTTP latency, not Stratum job delivery.</text>
