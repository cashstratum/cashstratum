CashStratum default configuration.
- btcsig: Signature string included in coinbase transactions.
- sockdir: Directory path for Unix domain communication sockets.
- bchaddress: Solo mining payout address (CashAddr format).
- pooladdress: Fee collection address.
- poolfee: Percentage fee deducted from block reward.
- serverurl: Stratum mining endpoints listened on by CashStratum.
